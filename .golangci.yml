version: "2"

linters:
  enable:
    - gosec # security: file permissions, path handling, weak crypto
    - errorlint # wrapped errors compared with errors.Is/As
    - misspell
    - unconvert
    - gocritic
  settings:
    gosec:
      # G104 duplicates errcheck.
      excludes: [G104]
  exclusions:
    rules:
      # Tests create throwaway files; gosec's file-mode rules are about
      # shipped code.
      - path: _test\.go
        linters: [gosec]

formatters:
  enable:
    - gofmt
